[package]
name = "stellar-dominion"
version = "3.0.0"
edition = "2021"
description = "A turn-based 4X space strategy game (Rust + macroquad)"
license = "MIT"

[[bin]]
name = "stellar-dominion"
path = "src/main.rs"
required-features = ["ui"]

[lib]
name = "stellar_dominion"
path = "src/lib.rs"

# The macroquad frontend is optional so the simulation can be built and tested
# headlessly (CI, servers, tooling) without any windowing system.
[features]
default = ["ui"]
ui = ["dep:macroquad"]

[dependencies]
macroquad = { version = "0.4", optional = true }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rand needs a getrandom backend on wasm32-unknown-unknown. The `js` feature
# pulls in wasm-bindgen, which macroquad's own JS glue (rust/web/mq_js_bundle.js)
# cannot satisfy, so the browser build registers a small crypto.getRandomValues
# backend instead — see the `wasm_entropy` module in main.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
opt-level = 2
