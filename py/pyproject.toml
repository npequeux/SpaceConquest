[project]
name = "stellar-dominion"
version = "2.0.0"
description = "Stellar Dominion — a turn-based 4X space strategy game (Python / pygame-ce)"
requires-python = ">=3.12"
dependencies = ["pygame-ce>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stellar_dominion"]
