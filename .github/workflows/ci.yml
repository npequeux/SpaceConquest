name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: rustup component add clippy

      - name: Lint (headless simulation)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Build (headless simulation)
        run: cargo build --no-default-features

      - name: Test
        run: cargo test --no-default-features

  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: rustup component add clippy

      - name: Lint (macroquad frontend)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the macroquad frontend
        run: cargo build

  # Release build on every push and merge; a pushed tag also publishes a
  # GitHub release carrying the Windows executable.
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the release binary
        run: cargo build --release

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: stellar-dominion-windows
          path: rust/target/release/stellar-dominion.exe
          if-no-files-found: error

      - name: Update the moving "latest" release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="Windows build of ${GITHUB_SHA} on ${GITHUB_REF_NAME}."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest target/release/stellar-dominion.exe --clobber
            gh release edit latest --title 'Stellar Dominion (latest)' --prerelease --notes "${notes}"
          else
            gh release create latest target/release/stellar-dominion.exe \
              --title 'Stellar Dominion (latest)' --prerelease --notes "${notes}"
          fi

      - name: Publish a GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "target/release/stellar-dominion.exe#stellar-dominion-${GITHUB_REF_NAME}.exe"
          --title "Stellar Dominion ${GITHUB_REF_NAME}"
          --notes "Windows build of Stellar Dominion ${GITHUB_REF_NAME}."

  # The browser build is published to GitHub Pages on every push. Pages is
  # configured with `build_type: legacy` on the `gh-pages` branch (the Actions
  # Pages environment GitHub creates carries a branch policy that blocks main,
  # which left deployments accepted but the site unpublished).
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build the web version
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Stage the web build
        run: cp target/wasm32-unknown-unknown/release/stellar-dominion.wasm web/

      - name: Publish to the gh-pages branch
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DIR: /home/runner/gh-pages
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${TARGET_DIR}"
          cp web/index.html web/mq_js_bundle.js web/stellar-dominion.wasm "${TARGET_DIR}/"
          cd "${TARGET_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA} to GitHub Pages" || true
          git push origin gh-pages
