name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce

      - name: Compile check
        run: python -m compileall -q stellar_dominion tools main.py

      - name: Headless interaction tests
        run: python tools/interact_test.py

      - name: Headless render test
        run: python tools/render_test.py out/
