name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce

      - name: Compile check
        run: python -m compileall -q stellar_dominion tools main.py

      - name: Headless interaction tests
        run: python tools/interact_test.py

      - name: Headless render test
        run: python tools/render_test.py out/

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (headless simulation)
        run: cargo build --no-default-features

      - name: Test
        run: cargo test --no-default-features

  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the macroquad frontend
        run: cargo build
