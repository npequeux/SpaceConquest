name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: rustup component add clippy

      - name: Lint (headless simulation)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Build (headless simulation)
        run: cargo build --no-default-features

      - name: Test
        run: cargo test --no-default-features

  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: rustup component add clippy

      - name: Lint (macroquad frontend)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the macroquad frontend
        run: cargo build

  # Build a real install package for every supported platform.
  packages:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x64
            kind: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            slug: linux-x64
            kind: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            slug: macos-arm64
            kind: macos
          - os: macos-latest
            target: x86_64-apple-darwin
            slug: macos-x64
            kind: macos
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the Linux windowing dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libgl1-mesa-dev libudev-dev zip
          ( sudo apt-get install -y --no-install-recommends libasound2-dev ) \
            || ( sudo apt-get install -y --no-install-recommends libasound2t64-dev )

      - name: Build the release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: ./install/package.sh "${{ matrix.slug }}" "${{ matrix.target }}" "${{ matrix.kind }}"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.slug }}
          path: |
            rust/dist/${{ matrix.slug }}/*.msi
            rust/dist/${{ matrix.slug }}/*.zip
            rust/dist/${{ matrix.slug }}/*.exe
            rust/dist/${{ matrix.slug }}/*.tar.gz
            rust/dist/${{ matrix.slug }}/*.deb
            rust/dist/${{ matrix.slug }}/*.dmg
          if-no-files-found: error

  # Attach the packages to GitHub releases: the moving `latest` prerelease on
  # every push, and a versioned release for tags (plus the first stable
  # release of the current crate version).
  publish:
    runs-on: ubuntu-latest
    needs: [packages]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List the packages
        run: ls -lR artifacts

      - name: Move the "latest" prerelease to this build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no packages to publish" >&2
            exit 1
          fi
          list="$(printf -- '- %s\n' "${files[@]##*/}")"
          notes="Install packages built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}."$'\n\n'"${list}"

          # Drop assets from earlier builds that this build no longer produces.
          for old in $(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null || true); do
            keep=0
            for f in "${files[@]}"; do
              [ "${f##*/}" = "$old" ] && keep=1
            done
            if [ "$keep" -eq 0 ]; then
              gh release delete-asset latest "$old" --yes
            fi
          done

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "${files[@]}" --clobber
            gh release edit latest --title 'Stellar Dominion (latest)' \
              --prerelease --notes "${notes}"
          else
            gh release create latest "${files[@]}" \
              --title 'Stellar Dominion (latest)' --prerelease --notes "${notes}"
          fi

      - name: Publish the stable release for the crate version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f | sort)
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n 1)"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already published - skipping"
            exit 0
          fi
          gh release create "v${VERSION}" "${files[@]}" \
            --title "Stellar Dominion v${VERSION}" \
            --notes "Install packages for Stellar Dominion v${VERSION}."

      - name: Publish a release for a pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f | sort)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME]}" "${files[@]}" \
              --title "Stellar Dominion ${GITHUB_REF_NAME}" \
              --notes "Install packages for Stellar Dominion ${GITHUB_REF_NAME}." \
              --verify-tag
          fi

  # The browser build is published to GitHub Pages on every push. Pages is
  # configured with `build_type: legacy` on the `gh-pages` branch (the Actions
  # Pages environment GitHub creates carries a branch policy that blocks main,
  # which left deployments accepted but the site unpublished).
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build the web version
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Stage the web build
        run: cp target/wasm32-unknown-unknown/release/stellar-dominion.wasm web/

      - name: Publish to the gh-pages branch
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DIR: /home/runner/gh-pages
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${TARGET_DIR}"
          cp web/index.html web/mq_js_bundle.js web/stellar-dominion.wasm "${TARGET_DIR}/"
          cd "${TARGET_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA} to GitHub Pages" || true
          git push origin gh-pages
